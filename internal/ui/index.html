<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laneq</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
    --accent: #3d5afe; --accent-ink: #ffffff; --ok: #1b7f4b; --warn: #a15c00; --bad: #b3261e;
    --chip: #efefeb; --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --ink: #ecece8; --muted: #9b9b94; --line: #2e2e2b;
      --accent: #8c9eff; --accent-ink: #10132b; --ok: #6fcf97; --warn: #f2b45a; --bad: #f28b82;
      --chip: #2a2a27; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  header .grow, h2 .grow, .row .grow { flex: 1; }
  main { max-width: 1440px; margin: 0 auto; padding: 20px 16px 60px; display: grid; gap: 20px; }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; white-space: nowrap; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  button.power { background: var(--bad); color: #fff; border-color: var(--bad); font-weight: 700; padding: 6px 14px; }
  .group td { background: var(--bg); font-weight: 600; }
  button.toggle[aria-pressed="true"] { background: var(--chip); border-color: var(--muted); font-weight: 600; }
  input, select { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.job { cursor: pointer; }
  tr.job:hover td { background: var(--bg); }
  .key { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .err { color: var(--bad); font-size: 12px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .counts { display: flex; gap: 6px; flex-wrap: wrap; }
  .state-queued { color: var(--accent); } .state-running { color: var(--ok); } .state-dead { color: var(--bad); }
  .state-held { color: var(--warn); } .state-canceled, .state-succeeded { color: var(--muted); }
  .banner { padding: 10px 14px; border-radius: 8px; background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .empty { color: var(--muted); padding: 8px 0; }
  a { color: var(--accent); }
  dialog { border: 0; border-radius: 12px; padding: 0; max-width: min(900px, 96vw); width: 100%; background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog .top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  dialog pre { margin: 14px; padding: 10px; background: var(--bg); border-radius: 8px; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, Consolas, monospace; max-height: 70vh; overflow: auto; }
  @media (max-width: 640px) { header { padding: 12px 16px; } }
</style>
</head>
<body>
<header>
  <h1>laneq</h1>
  <span class="muted" id="where"></span>
  <span class="grow"></span>
  <span id="conn" class="chip">connecting…</span>
  <button class="power" onclick="powerOff()" title="Stop every app, then laneq itself">⏻ Power off</button>
</header>
<main id="app"></main>

<dialog id="detail">
  <div class="top"><strong id="d-title"></strong><span class="grow" style="flex:1"></span><span id="d-actions" class="row"></span><button onclick="detail.close()">Close</button></div>
  <pre id="d-body"></pre>
</dialog>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STATES = ["queued", "running", "held", "dead", "succeeded", "canceled"];
const PAGE = 50;
const state = { lane: "*", states: ["queued", "running", "held", "dead"], type: "", offset: 0, newest: false, busy: false, error: "" };
try { Object.assign(state, JSON.parse(localStorage.getItem("laneq.filters") || "{}"), { offset: 0 }); } catch {}
const saveFilters = () => { try { localStorage.setItem("laneq.filters", JSON.stringify({ lane: state.lane, states: state.states, type: state.type, newest: state.newest })); } catch {} };

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 204 || r.status === 202) return { data: null, total: 0 };
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return { data, total: +(r.headers.get("X-Total-Count") || 0) };
}
const get = async path => (await api("GET", path)).data;

// --- formatting ---
function fmtWhen(s) {
  if (!s || s.startsWith("0001")) return "";
  const d = new Date(s), ms = d - Date.now(), abs = Math.abs(ms);
  const rel = abs < 60e3 ? "now" : abs < 3600e3 ? `${Math.round(abs / 60e3)}m` : abs < 86400e3 ? `${Math.round(abs / 3600e3)}h` : `${Math.round(abs / 86400e3)}d`;
  return `${d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })} <span class="muted">(${rel === "now" ? "now" : ms > 0 ? "in " + rel : rel + " ago"})</span>`;
}
const laneName = l => l === "" ? "(no lane)" : l;

// --- actions ---
async function act(fn, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try { state.busy = true; await fn(); state.error = ""; }
  catch (e) { state.error = e.message; }
  finally { state.busy = false; refresh(); }
}
const jobAction = (id, what) => act(() => api("POST", `/v1/jobs/${id}/${what}`),
  what === "cancel" ? `Cancel job #${id}? It won't run.` : "");
const pause = (lane, paused) => act(() => api("POST", `/v1/lanes/${encodeURIComponent(lane)}/${paused ? "pause" : "resume"}`),
  paused ? `Pause lane "${lane}"? A running job finishes; nothing else in the lane runs until you resume.` : "");
function clearLane(lane) {
  const l = state.lanes.find(l => l.name === lane), c = l.counts || {};
  const n = (c.queued || 0) + (c.held || 0) + (c.dead || 0);
  act(() => api("POST", `/v1/lanes/${encodeURIComponent(lane)}/clear`, {}),
    `Clear lane "${lane}"?\n\nThis cancels all ${n} waiting jobs (${c.queued || 0} queued, ${c.held || 0} held, ${c.dead || 0} dead). `
    + "A running job finishes. Canceled jobs can't be brought back.");
}
function toggleSchedule(lane) {
  const s = state.schedules.find(s => s.lane === lane);
  act(() => api("PUT", `/v1/schedules/${encodeURIComponent(lane)}`, { ...s, enabled: !s.enabled }),
    s.enabled ? `Turn off the schedule for "${lane}"? Its daily releases stop until you turn it back on.` : "");
}
function powerOff() {
  const up = (state.apps || []).filter(a => a.status === "running" || a.status === "stopping").map(a => a.title || a.name);
  act(async () => { await api("POST", "/v1/admin/poweroff"); state.poweringOff = true; },
    "Power off laneq?\n\n" + (up.length ? `First every app is stopped (${up.join(", ")}): each finishes the job it's on, `
      + "and any still running after 2 minutes is ended. " : "No apps are running. ")
    + "Then laneq writes a final snapshot and exits. Nothing runs until laneq and the apps are started again.");
}
function appAction(name, what) {
  const a = state.apps.find(a => a.name === name), title = a.title || a.name;
  act(() => api("POST", `/v1/apps/${encodeURIComponent(name)}/${what}`), {
    stop: `Stop ${title}?\n\nIt finishes the job it's on, then exits. Its jobs wait in the queue until it's started again`
      + (a.start_hint ? ` (${a.start_hint}).` : "."),
    kill: `Kill ${title} now (process ${a.pid})?\n\nIt's ended at once, mid-job if it's working; that job runs again later. `
      + "Use Stop unless it isn't responding.",
  }[what]);
}

// --- filters ---
function setLane(v) { state.lane = v; state.offset = 0; saveFilters(); refresh(); }
function toggleState(s) {
  state.states = state.states.includes(s) ? state.states.filter(x => x !== s) : [...state.states, s];
  state.offset = 0; saveFilters(); refresh();
}
function setType(v) { state.type = v.trim(); state.offset = 0; saveFilters(); refresh(); }
function toggleNewest() { state.newest = !state.newest; state.offset = 0; saveFilters(); refresh(); }
function page(d) { state.offset = Math.max(0, state.offset + d * PAGE); refresh(); }

// --- data ---
async function refresh() {
  try {
    const q = new URLSearchParams({ limit: PAGE, offset: state.offset });
    if (state.lane !== "*") q.set("lane", state.lane);
    if (state.states.length) q.set("state", state.states.join(","));
    if (state.type) q.set("type", state.type);
    if (state.newest) q.set("newest", "true");
    const [lanes, schedules, jobs, apps] = await Promise.all([get("/v1/lanes"), get("/v1/schedules"), api("GET", "/v1/jobs?" + q),
      get("/v1/apps").catch(() => [])]);
    Object.assign(state, { lanes, schedules, apps, jobs: jobs.data, total: jobs.total, loaded: true });
    state.byId = Object.fromEntries(jobs.data.map(j => [j.id, j]));
    $("#conn").textContent = "live"; $("#conn").className = "chip ok";
  } catch (e) {
    $("#conn").textContent = state.poweringOff ? "powered off" : "server unreachable"; $("#conn").className = "chip bad";
  }
  render();
}

// --- rendering ---
function counts(c = {}) {
  const shown = STATES.filter(s => c[s]);
  return shown.length ? shown.map(s => `<span class="chip state-${s}">${c[s]} ${s}</span>`).join("") : `<span class="muted">empty</span>`;
}

// Lanes named "<app>/<lane>" belong to that app; the rest are grouped under "Other".
const appOf = name => name.includes("/") ? name.slice(0, name.indexOf("/")) : "";
const STATUS_CHIP = { running: "ok", stopping: "warn", stopped: "", "not responding": "bad" };

function appsPanel() {
  const rows = state.apps.map(a => {
    const N = esc(JSON.stringify(a.name)), up = a.status === "running" || a.status === "stopping";
    return `<tr>
      <td><strong>${esc(a.title || a.name)}</strong>${a.title ? ` <span class="muted">${esc(a.name)}</span>` : ""}
        ${a.dashboard ? `<div><a href="${esc(a.dashboard)}" target="_blank" rel="noopener">Open its dashboard ↗</a></div>` : ""}</td>
      <td><span class="chip ${STATUS_CHIP[a.status] ?? ""}">${esc(a.status)}</span>
        ${a.status === "stopped" && a.start_hint ? `<div class="muted">start: ${esc(a.start_hint)}</div>` : ""}</td>
      <td class="num">${a.pid ? `pid ${a.pid}` : ""}<div class="muted">seen ${fmtWhen(a.last_seen)}</div></td>
      <td><div class="row">
        <button onclick='appAction(${N}, "stop")' ${up && !a.stop ? "" : "disabled"}>Stop</button>
        <button class="danger" onclick='appAction(${N}, "kill")' ${up ? "" : "disabled"}>Kill</button>
      </div></td>
    </tr>`;
  }).join("");
  return `<section class="panel">
    <h2>Apps <span class="chip">${state.apps.length}</span></h2>
    ${state.apps.length ? `<div class="scroll"><table><tr><th>App</th><th>Status</th><th>Process</th><th></th></tr>${rows}</table></div>`
      : `<div class="empty">No app has checked in. An app's worker shows up here once it sends POST /v1/apps/{name}/heartbeat.</div>`}
  </section>`;
}

function lanesPanel() {
  const titleOf = app => (state.apps.find(a => a.name === app) || {}).title || app;
  const groups = [...new Set(state.lanes.map(l => appOf(l.name)))].sort((a, b) => (a === "") - (b === "") || a.localeCompare(b));
  const laneRow = l => {
    const s = state.schedules.find(s => s.lane === l.name), L = esc(JSON.stringify(l.name));
    const waiting = (l.counts.queued || 0) + (l.counts.held || 0) + (l.counts.dead || 0);
    const sched = !s ? `<span class="muted">none</span>`
      : `<span class="chip ${s.enabled ? "ok" : ""}">${s.enabled ? "on" : "off"}</span> ${esc(s.at)} · ${s.count}/day`
        + (s.enabled && !l.paused ? `<div class="muted">next ${fmtWhen(s.next_run)}</div>` : "");
    return `<tr>
      <td><a href="#" onclick='setLane(${L}); return false'>${esc(laneName(appOf(l.name) ? l.name.slice(appOf(l.name).length + 1) : l.name))}</a>
        ${l.paused ? ` <span class="chip warn">paused</span>` : ""}</td>
      <td><div class="counts">${counts(l.counts)}</div></td>
      <td>${sched}</td>
      <td><div class="row">
        ${l.name === "" ? `<span class="muted">jobs without a lane run independently</span>` : `
        <button onclick='pause(${L}, ${!l.paused})' class="${l.paused ? "primary" : ""}">${l.paused ? "Resume" : "Pause"}</button>
        ${s ? `<button onclick='toggleSchedule(${L})'>Schedule ${s.enabled ? "off" : "on"}</button>` : ""}
        <button class="danger" onclick='clearLane(${L})' ${waiting ? "" : "disabled"}>Clear…</button>`}
      </div></td>
    </tr>`;
  };
  const rows = groups.map(g => `<tr class="group"><td colspan="4">${g ? esc(titleOf(g)) : "Other"}</td></tr>`
    + state.lanes.filter(l => appOf(l.name) === g).map(laneRow).join("")).join("");
  return `<section class="panel">
    <h2>Lanes <span class="chip">${state.lanes.length}</span></h2>
    ${state.lanes.length ? `<div class="scroll"><table>
      <tr><th>Lane</th><th>Jobs</th><th>Schedule</th><th></th></tr>${rows}</table></div>`
      : `<div class="empty">No jobs yet.</div>`}
  </section>`;
}

function actionsFor(j) {
  const b = [];
  if (j.state === "dead" || (j.state === "queued" && j.last_error)) b.push(`<button class="primary" onclick="event.stopPropagation(); jobAction(${j.id}, 'retry')">Retry</button>`);
  if (j.state === "queued" && j.lane) b.push(`<button onclick="event.stopPropagation(); jobAction(${j.id}, 'hold')" title="Back to held, until its lane's next release">Hold</button>`);
  if (["queued", "held", "dead"].includes(j.state)) b.push(`<button class="danger" onclick="event.stopPropagation(); jobAction(${j.id}, 'cancel')">Cancel</button>`);
  return b.join("");
}

function jobsPanel() {
  const lanes = ["*", ...state.lanes.map(l => l.name)];
  const rows = state.jobs.map(j => `<tr class="job" onclick="openJob(${j.id})">
      <td class="num">#${j.id}</td>
      <td>${esc(j.type)}</td>
      <td>${esc(laneName(j.lane || ""))}</td>
      <td><div class="key" title="${esc(j.key)}">${esc(j.key) || `<span class="muted">—</span>`}</div>
        ${j.last_error ? `<div class="err" title="${esc(j.last_error)}">${esc(j.last_error)}</div>` : ""}</td>
      <td><span class="chip state-${j.state}">${j.state}</span></td>
      <td class="num">${j.attempts}/${j.max_attempts}</td>
      <td class="num">${j.state === "running" ? `lease ${fmtWhen(j.lease_expires)}` : j.finished_at ? fmtWhen(j.finished_at) : fmtWhen(j.run_at)}</td>
      <td><div class="row">${actionsFor(j)}</div></td>
    </tr>`).join("");
  const from = state.total ? state.offset + 1 : 0, to = state.offset + state.jobs.length;
  return `<section class="panel">
    <h2>Jobs <span class="chip">${state.total}</span></h2>
    <div class="row" style="margin-bottom:10px">
      <label>Lane <select onchange="setLane(this.value)">${lanes.map(l => `<option value="${esc(l)}" ${l === state.lane ? "selected" : ""}>${l === "*" ? "all lanes" : esc(laneName(l))}</option>`).join("")}</select></label>
      <span class="muted">State</span>
      ${STATES.map(s => `<button class="toggle" aria-pressed="${state.states.includes(s)}" onclick="toggleState('${s}')">${s}</button>`).join("")}
      <label>Type <input value="${esc(state.type)}" placeholder="any" size="12" onchange="setType(this.value)"></label>
      <button class="toggle" aria-pressed="${state.newest}" onclick="toggleNewest()">newest first</button>
    </div>
    ${state.jobs.length ? `<div class="scroll"><table>
      <tr><th>ID</th><th>Type</th><th>Lane</th><th>Key</th><th>State</th><th>Tries</th><th>When</th><th></th></tr>${rows}</table></div>`
      : `<div class="empty">No jobs match.</div>`}
    <div class="row" style="margin-top:10px">
      <span class="muted">${from}–${to} of ${state.total}</span><span class="grow"></span>
      <button onclick="page(-1)" ${state.offset ? "" : "disabled"}>← Previous</button>
      <button onclick="page(1)" ${to < state.total ? "" : "disabled"}>Next →</button>
    </div>
  </section>`;
}

function openJob(id) {
  const j = state.byId[id];
  if (!j) return;
  $("#d-title").textContent = `#${j.id} ${j.type}${j.lane ? " · " + j.lane : ""} · ${j.state}`;
  $("#d-actions").innerHTML = actionsFor(j).replaceAll("event.stopPropagation(); ", "detail.close(); ");
  $("#d-body").textContent = JSON.stringify(j, null, 2);
  detail.showModal();
}

function render() {
  if (!state.loaded) { $("#app").innerHTML = `<div class="empty">Loading…</div>`; return; }
  $("#where").textContent = location.host;
  $("#app").innerHTML = `${state.error ? `<div class="banner">${esc(state.error)}</div>` : ""}`
    + `${state.poweringOff ? `<div class="banner">Powering off: stopping the apps, then laneq…</div>` : ""}`
    + `${appsPanel()}${lanesPanel()}${jobsPanel()}`;
}

refresh();
setInterval(() => { if (!state.busy && !detail.open && document.activeElement?.tagName !== "INPUT") refresh(); }, 5000);
</script>
</body>
</html>
