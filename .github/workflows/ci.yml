name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Test (race detector on Linux)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then go test -race -count=1 ./...; else go test -count=1 ./...; fi
      - name: Benchmark
        if: runner.os == 'Linux'
        run: go run ./cmd/laneq-bench -jobs 10000 -producers 16 -workers 16
